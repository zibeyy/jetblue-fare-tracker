name: Track JetBlue fares

on:
  schedule:
    # 4x daily, offset from the top of the hour (GitHub delays :00 crons).
    # UTC 02:37, 08:37, 14:37, 20:37 = 21:37, 03:37, 09:37, 15:37 Eastern (EST).
    - cron: "37 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification first"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ inputs.test_alert && '1' || '' }}
        run: python tracker.py

      - name: Commit history
        run: |
          git config user.name "fare-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "fares: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          else
            echo "No data changes to commit."
          fi
